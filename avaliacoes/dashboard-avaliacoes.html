<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard de Avaliações</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<link rel="stylesheet" href="/faturamento/faturamento.css"><link rel="stylesheet" href="/avaliacoes/avaliacoes.css"></head><body>
<div class="icon-sidebar">
<button class="icon-btn" data-tooltip="Menu" type="button"><span class="material-icons">menu</span></button>
<button class="icon-btn" data-tooltip="Insumos" onclick="location.href='/insumos'"><span class="material-icons">inventory_2</span></button>
<button class="icon-btn " data-tooltip="Avaliações" onclick="location.href='/avaliacoes'"><span class="material-icons">reviews</span></button>
<button class="icon-btn" data-tooltip="Faturamento" onclick="location.href='/faturamento'"><span class="material-symbols-outlined">bar_chart</span></button>
<button class="icon-btn active" data-tooltip="Dashboard" onclick="location.href='/dashboard-avaliacoes'"><span class="material-icons">dashboard</span></button>
</div><main class="main">
<header class="topbar"><div class="titulo-area"><img src="/images/logo%20redondo.png" class="logo-header" alt="Logo L’amore"><span class="titulo">Dashboard de Avaliações</span></div>
<div class="topbar-actions"><div class="search-container"><input type="text" placeholder="Pesquisar pedido..." id="searchInput" autocomplete="off"><button class="topbar-icon-btn" type="button"><span class="material-icons">search</span></button></div></div></header>
<h2 class="filtros-titulo">Filtros <span id="demo"></span></h2>
<section class="filtros"><label class="campo">Ano<select id="fAno"></select></label><label class="campo">Estado (UF)<select id="fUf"></select></label><label class="campo">Categoria<select id="fCat"></select></label></section>
<section class="cards" id="cards"></section>
<section class="box"><div class="secao-titulo">Avaliações e nota média por mês</div><div id="gMensal" class="grafico grafico-mensal"></div></section>
<div class="duas-colunas">
<section class="box"><div class="secao-titulo">Distribuição das notas</div><div id="gNotas" class="grafico" style="height:300px"></div></section>
<section class="box"><div class="secao-titulo">Motivos de não resolução</div><div id="gMotivos" class="grafico" style="height:300px"></div></section></div>
<section class="box"><div class="secao-titulo">Avaliações por estado</div>
<label class="campo" style="max-width:260px">Mostrar<select id="mapaMetrica"><option value="qtd">Quantidade de avaliações</option><option value="media">Nota média</option></select></label>
<div id="gMapa" class="grafico grafico-mapa"></div><p id="avisoMapa" class="legenda" hidden></p></section>
<section class="box"><div class="secao-titulo">Últimas avaliações <span class="contador" id="contador"></span></div><div class="tabela-scroll tabela-pedidos"><table class="tabela"><thead><tr><th>Nº</th><th>Cliente</th><th>Categoria</th><th>Nota</th><th>Comentário</th><th>Data</th><th>Status</th></tr></thead><tbody id="tbody"></tbody></table></div></section>
</main><div id="toast" class="toast"></div>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<script src="/avaliacoes/avaliacoes-comum.js"></script><script src="/avaliacoes/dashboard-avaliacoes.js"></script></body></html>
