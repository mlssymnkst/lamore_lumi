<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avaliações L'amore</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<link rel="stylesheet" href="/faturamento/faturamento.css"><link rel="stylesheet" href="/avaliacoes/avaliacoes.css"></head><body>
<div class="icon-sidebar">
<button class="icon-btn" data-tooltip="Menu" type="button"><span class="material-icons">menu</span></button>
<button class="icon-btn" data-tooltip="Insumos" onclick="location.href='/insumos'"><span class="material-icons">inventory_2</span></button>
<button class="icon-btn active" data-tooltip="Avaliações" onclick="location.href='/avaliacoes'"><span class="material-icons">reviews</span></button>
<button class="icon-btn" data-tooltip="Faturamento" onclick="location.href='/faturamento'"><span class="material-symbols-outlined">bar_chart</span></button>
<button class="icon-btn " data-tooltip="Dashboard" onclick="location.href='/dashboard-avaliacoes'"><span class="material-icons">dashboard</span></button>
</div><main class="main">
<header class="topbar"><div class="titulo-area"><img src="/images/logo%20redondo.png" class="logo-header" alt="Logo L’amore"><span class="titulo">Avaliações L'amore</span></div>

<h2 class="filtros-titulo">Controle de Reclamações <span id="demo"></span></h2>

<p class="legenda" id="resumo"></p><section class="lista" id="lista"></section>
</main><div id="toast" class="toast"></div>
<script src="/avaliacoes/avaliacoes-comum.js"></script><script src="/avaliacoes/avaliacoes.js"></script></body></html>
