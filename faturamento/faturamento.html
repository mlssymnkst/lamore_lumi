<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faturamento L'amore</title>
    <link rel="icon" type="image/png" href="/images/logo%20redondo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">

    <link rel="stylesheet" href="/faturamento/faturamento.css">
</head>
<body>

    <!-- ════════ BARRA DE ÍCONES (igual à do chatbot) ════════ -->
    <div class="icon-sidebar">
        <button class="icon-btn" data-tooltip="Menu" type="button">
            <span class="material-icons">menu</span>
        </button>

        <button class="icon-btn" data-tooltip="Insumos" onclick="window.location.href='/insumos'">
            <span class="material-icons">inventory_2</span>
        </button>

        <button class="icon-btn" data-tooltip="Chatbot" onclick="window.location.href='/chatbot'">
            <span class="material-icons">reviews</span>
        </button>

        <button class="icon-btn" data-tooltip="Faturamento" onclick="window.location.href='/faturamento'">
            <span class="material-symbols-outlined">bar_chart</span>
        </button>
    </div>

    <main class="main">

        <!-- ════════ CABEÇALHO ════════ -->
        <header class="topbar">
            <div class="titulo-area">
                <img src="/images/logo%20redondo.png" class="logo-header" alt="Logo L’amore">
                <span class="titulo">Faturamento L'amore</span>
            </div>

            <!-- pesquisa + perfil: mesmo HTML/CSS do chatbot -->
            <div class="topbar-actions">
                <div class="search-container">
                    <input type="text" placeholder="Pesquisar pedido..." id="searchInput" autocomplete="off">
                    <button class="topbar-icon-btn" id="searchBtn" title="Pesquisar pedidos" type="button">
                        <span class="material-icons">search</span>
                    </button>
                </div>

                <button class="topbar-icon-btn" title="Conta" type="button"
                        onclick="window.location.href='/'">
                    <span class="material-icons">person</span>
                </button>
            </div>
        </header>

        <div id="aviso" class="aviso" hidden></div>

        <!-- ════════ FILTROS ════════ -->
        <h2 class="filtros-titulo">Filtros</h2>
        <section class="filtros">
            <label class="campo">Ano
                <select id="filtroAno"></select>
            </label>
            <label class="campo">Status dos pedidos
                <select id="filtroStatus"></select>
            </label>
            <label class="campo">Estado (UF)
                <select id="filtroUf"></select>
            </label>
        </section>
        <p id="resultadoBusca" class="legenda" hidden></p>

        <!-- ════════ CARDS ════════ -->
        <section class="cards" id="cards"></section>

        <!-- ════════ GRÁFICO MENSAL ════════ -->
        <section class="box">
            <div class="secao-titulo" id="tituloGrafico">Faturamento mensal</div>
            <div id="graficoMensal" class="grafico grafico-mensal"></div>

            <details class="detalhes">
                <summary>Ver tabela mensal</summary>
                <div class="tabela-scroll">
                    <table class="tabela" id="tabelaMensal">
                        <thead><tr><th>Mês</th><th class="num">Pedidos</th><th class="num">Faturamento</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </details>
        </section>

        <!-- ════════ TABELA + MAPA ════════ -->
        <div class="duas-colunas">
            <section class="box">
                <div class="secao-titulo">Pedidos <span class="contador" id="contadorPedidos"></span></div>
                <div class="tabela-scroll tabela-pedidos">
                    <table class="tabela" id="tabelaPedidos">
                        <thead>
                            <tr>
                                <th>Nº</th><th>Cliente</th><th>Categoria</th>
                                <th class="num">Valor</th><th>Data</th><th>Status</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>

            <section class="box">
                <div class="secao-titulo">Faturamento por estado</div>
                <div id="graficoMapa" class="grafico grafico-mapa"></div>
                <p id="avisoMapa" class="legenda" hidden></p>

                <label class="campo campo-consulta">Consultar estado
                    <select id="estadoConsulta"></select>
                </label>
                <div class="metrica">
                    <div class="metrica-rotulo" id="metricaRotulo">Faturamento</div>
                    <div class="metrica-valor" id="metricaValor">—</div>
                </div>
            </section>
        </div>
    </main>

    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <script src="/faturamento/faturamento.js"></script>
</body>
</html>
